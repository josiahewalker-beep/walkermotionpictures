    } else buf = new Uint8Array(await res.arrayBuffer());
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(f.iv) }, key, buf);
    return URL.createObjectURL(new Blob([plain], { type: f.mime }));
  }

  async function show(d, key, email) {
    const videos = {};
    await Promise.all(Object.entries(d.videos || {}).map(async ([k, v]) => {
      const out = { enc: v.enc };
      if (v.poster) { try { out.poster = await load(key, v.poster); } catch (e) {} }
      videos[k] = out;
    }));
    window.__EXA = { email, videos, load: (f, p) => load(key, f, p) };
    const doc = new DOMParser().parseFromString(d.page, 'text/html');
    const scripts = [];
    $('gate').remove();
    [...doc.head.childNodes, ...doc.body.childNodes].forEach(n => {
      if (n.nodeType !== 1) { document.body.appendChild(document.importNode(n, true)); return; }
      const tag = n.tagName;
      if (tag === 'TITLE' || tag === 'META' || tag === 'LINK') return;
      if (tag === 'STYLE') { document.head.appendChild(document.importNode(n, true)); return; }
      if (tag === 'SCRIPT') { scripts.push(n.textContent); return; }
      document.body.appendChild(document.importNode(n, true));
    });
    scrollTo(0, 0);
    scripts.forEach(code => { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); });
  }

  function record(email) {
    try {
      fetch(LOG, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ email, _subject: 'exacare proposal opened by ' + email,
          message: 'Opened ' + location.href + ' on ' + new Date().toString() }) }).catch(() => {});
    } catch (e) {}
  }

  async function tryOpen(email, pw, quiet) {
    $('go').disabled = true; if (!quiet) { $('msg').style.color = '#7A6D60'; $('msg').textContent = 'Checking…'; }
    let res;
    try { res = await open(pw); }
    catch (e) {
      store.del(); $('go').disabled = false;
      if (!quiet) { $('msg').style.color = ''; $('msg').textContent = window.crypto && crypto.subtle ? 'That password is not right.' : 'This browser cannot open the page. Try a current browser.'; $('pw').select(); }
      else $('msg').textContent = '';
      return;
    }
    if (res.role === 'owner') {   // Josiah's own password: no email, no visit log, no viewer stamp
      store.set({ pw });
      await show(res.d, res.key, '');
      return;
    }
    if (!DOMAIN.test(email)) {
      store.del(); $('go').disabled = false;
      $('msg').style.color = ''; $('msg').textContent = 'Only @exacare.com emails may enter.'; if (!quiet) $('em').focus();
      return;
    }
    store.set({ email, pw });
    if (!quiet) record(email);
    await show(res.d, res.key, email);
  }

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    const email = $('em').value.trim(), pw = $('pw').value;
    $('msg').style.color = '';
    if (/^jjj$/i.test(email)) { tryOpen('', 'JJJ', false); return; }   // Josiah's shortcut, typed in the email box
    if (!pw) { $('msg').textContent = 'Enter the password.'; $('pw').focus(); return; }
    tryOpen(email, pw, false);
  });
  const saved = store.get();
  if (saved && saved.pw) tryOpen(saved.email || '', saved.pw, true); else $('em').focus();
})();
</script>
