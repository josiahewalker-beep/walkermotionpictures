<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walker Motion Pictures · Corporate video for fintech &amp; SaaS</title>
<meta name="description" content="A filmmaker who speaks fintech and SaaS. Customer stories, company updates and ads, made by someone who already knows how finance software gets sold.">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f6f7f9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root { --bg:#f6f7f9; --card:#ffffff; --ink:#0b1220; --ink-2:#111a2e; --mid:#4a5568; --dim:#8a94a6; --line:#e3e7ee; --accent:#2f5bff; --accent-2:#00b39b; --glow:rgba(47,91,255,.35);
  --head:'Inter Tight','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:light; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--body); -webkit-text-size-adjust:100%; }
a { color:inherit; } :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }
#void, #gl, #css { position:fixed; inset:0; }
#void { background:var(--bg); }
body.ending::after { opacity:var(--glow, 1); }
body::after { transition:none; }
header, .rail, .hint, .ctl, .build { transition:opacity 1.4s ease; }
body.ending header, body.ending .rail, body.ending .hint, body.ending .ctl, body.ending .build { opacity:0; pointer-events:none; }
/* the black hole */
#hole { position:fixed; z-index:6; left:0; top:0; width:40px; height:40px; margin:-20px 0 0 -20px; padding:0; border:0; border-radius:50%; cursor:pointer; background:radial-gradient(circle, #000 0 38%, rgba(0,0,0,.92) 48%, rgba(11,18,32,.35) 62%, transparent 72%); box-shadow:0 0 0 1px rgba(47,91,255,.25), 0 0 18px 2px rgba(47,91,255,.22), inset 0 0 6px rgba(0,179,155,.4); transition:opacity .6s ease; will-change:transform; }
#hole::before { content:''; position:absolute; inset:-30%; border-radius:50%; border:1px solid rgba(47,91,255,.35); animation:spin 9s linear infinite; mask:conic-gradient(from 0deg, transparent 0 40%, #000 70%, transparent 100%); -webkit-mask:conic-gradient(from 0deg, transparent 0 40%, #000 70%, transparent 100%); }
@keyframes spin { to { transform:rotate(360deg); } }
#hole:hover, #hole:focus-visible { box-shadow:0 0 0 1px rgba(47,91,255,.5), 0 0 26px 4px rgba(47,91,255,.35), inset 0 0 8px rgba(0,179,155,.6); outline:none; }
#hole.orb { background:radial-gradient(circle, #fff 0 30%, rgba(255,255,255,.9) 42%, rgba(255,255,255,.25) 60%, transparent 72%); box-shadow:0 0 30px 8px rgba(255,255,255,.55), 0 0 90px 30px rgba(180,200,255,.25); animation:breathe 3.2s ease-in-out infinite; }
#hole.orb::before { border-color:rgba(255,255,255,.35); }
@keyframes breathe { 50% { box-shadow:0 0 40px 14px rgba(255,255,255,.7), 0 0 120px 44px rgba(180,200,255,.3); } }
#hole .tip { position:absolute; left:50%; top:100%; transform:translate(-50%, 14px); white-space:nowrap; font:500 13px/1.3 var(--body); color:var(--ink); background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:9px; padding:7px 11px; box-shadow:0 10px 30px -14px rgba(11,18,32,.35); opacity:0; pointer-events:none; transition:opacity .25s; }
#hole:hover .tip, #hole:focus-visible .tip, #hole.showtip .tip { opacity:1; }
#hole.orb .tip { color:#fff; background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); }
#hole.busy { pointer-events:none; } #hole.busy .tip { opacity:0 !important; }
@media (hover:none) { #hole .tip { opacity:1; } }
@media (prefers-reduced-motion:reduce) { #hole::before, #hole.orb { animation:none; } }
#css { touch-action:none; cursor:grab; }
#css.dragging { cursor:grabbing; }
body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:1; background:radial-gradient(1100px 560px at 85% -10%, rgba(47,91,255,.10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(0,179,155,.08), transparent 60%); }
.glass { background:rgba(255,255,255,.72); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border:1px solid rgba(227,231,238,.95); }

/* ---------- chrome ---------- */
header { position:fixed; z-index:10; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,2.6vw) 14px; pointer-events:none; }
header > * { pointer-events:auto; }
.brand { display:flex; align-items:center; gap:10px; border-radius:12px; padding:7px 13px 7px 8px; cursor:pointer; font:inherit; color:var(--ink); }
.mark { width:24px; height:24px; flex:none; }
.brand b { font-family:var(--head); font-weight:700; font-size:15.5px; letter-spacing:-.015em; white-space:nowrap; }
nav.top { display:flex; gap:2px; border-radius:12px; padding:4px; }
nav.top button { font:inherit; font-size:13.5px; font-weight:500; color:var(--mid); background:none; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; white-space:nowrap; }
nav.top button:hover { color:var(--ink); background:rgba(11,18,32,.05); }
nav.top button.on { color:var(--ink); background:#fff; box-shadow:0 1px 2px rgba(11,18,32,.08); }
nav.top button.cta { color:#fff; background:var(--ink); margin-left:2px; }
nav.top button.cta:hover { background:var(--accent); }
@media (max-width:820px) { nav.top button:not(.cta) { display:none; } }
.rail { position:fixed; z-index:10; right:max(14px,2.2vw); top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:4px; padding:8px 6px; border-radius:14px; }
.rail button { position:relative; display:flex; align-items:center; justify-content:flex-end; gap:10px; background:none; border:0; padding:6px 6px; cursor:pointer; font:inherit; }
.rail i { width:8px; height:8px; border-radius:50%; background:#c7cfdc; transition:all .3s; }
.rail button.done i { background:#8fa3d6; }
.rail button.on i { background:var(--accent); box-shadow:0 0 0 4px rgba(47,91,255,.18); height:22px; border-radius:6px; }
.rail span { position:absolute; right:30px; white-space:nowrap; font-size:12.5px; font-weight:500; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 9px; opacity:0; transform:translateX(6px); transition:.2s; pointer-events:none; box-shadow:0 8px 20px -12px rgba(11,18,32,.3); }
.rail button:hover span, .rail button:focus-visible span { opacity:1; transform:none; }
@media (max-width:620px) { .rail { display:none; } }
.count { display:none; align-self:center; font-size:13px; font-weight:500; color:var(--mid); border-radius:999px; padding:7px 11px; font-variant-numeric:tabular-nums; }
@media (max-width:620px) { .count { display:block; } }
.hint { position:fixed; z-index:10; left:max(14px,2.6vw); bottom:calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--mid); border-radius:999px; padding:8px 14px; transition:opacity .5s; pointer-events:none; }
.hint kbd { font:inherit; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; background:#fff; color:var(--ink); }
.ctl { position:fixed; z-index:10; left:0; top:0; display:flex; gap:10px; align-items:center; will-change:transform; }
.ctl button { font:inherit; font-size:15px; font-weight:500; color:var(--ink); border-radius:999px; padding:12px 20px; min-height:46px; cursor:pointer; box-shadow:0 10px 30px -14px rgba(11,18,32,.35); }
.ctl button:hover { border-color:var(--accent); color:var(--accent); }
.ctl .bird { display:inline-flex; align-items:center; gap:8px; } .ctl .bird svg { width:18px; height:18px; flex:none; }
@media (max-width:620px) { .ctl .bird span { display:none; } .ctl .bird { padding:11px 13px; } }
.listbar { position:sticky; top:0; z-index:2; display:flex; justify-content:center; padding:0 0 18px; margin-top:-30px; }
.listbar button { font:inherit; font-size:15px; font-weight:500; color:#fff; background:var(--ink); border:0; border-radius:999px; padding:12px 20px; min-height:46px; cursor:pointer; box-shadow:0 10px 30px -14px rgba(11,18,32,.45); }
.listbar button:hover { background:var(--accent); }
.ctl .next { background:var(--ink); color:#fff; border-color:var(--ink); }
.ctl .next:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
@media (max-width:620px) { .hint { display:none; } .ctl button { font-size:14px; padding:11px 16px; min-height:44px; } }
.aud { position:fixed; z-index:12; left:50%; top:calc(env(safe-area-inset-top,0px) + 96px); transform:translateX(-50%); display:flex; gap:4px; align-items:center; padding:5px 6px 5px 12px; border-radius:12px; max-width:calc(100vw - 24px); overflow:auto; }
.aud span { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-right:6px; white-space:nowrap; }
.aud button { font:inherit; font-size:13px; font-weight:500; color:var(--mid); background:none; border:0; border-radius:8px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
.aud button:hover { color:var(--ink); background:rgba(11,18,32,.05); }
.aud button.on { color:#fff; background:var(--ink); }
.build { position:fixed; z-index:10; left:50%; top:calc(env(safe-area-inset-top,0px) + 66px); transform:translateX(-50%); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); background:rgba(47,91,255,.08); border:1px solid rgba(47,91,255,.2); border-radius:999px; padding:4px 10px; pointer-events:none; }

/* ---------- 3D cards ---------- */
.card { width:var(--w); background:var(--card); border:1px solid var(--line); border-radius:22px; padding:34px 34px 30px; box-shadow:0 1px 2px rgba(11,18,32,.06), 0 40px 90px -40px rgba(11,18,32,.4); cursor:pointer; user-select:none; -webkit-user-select:none; transition:box-shadow .35s, border-color .35s; font-size:15px; line-height:1.5; }
.card:hover { border-color:rgba(47,91,255,.5); box-shadow:0 1px 2px rgba(11,18,32,.06), 0 50px 100px -40px var(--glow); }
.card.here { cursor:default; border-color:rgba(47,91,255,.55); }
.card.night { background:radial-gradient(800px 400px at 100% 0%, rgba(47,91,255,.28), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(0,179,155,.16), transparent 60%), var(--ink); color:#e8ecf5; border-color:rgba(255,255,255,.08); }
.card.night p, .card.night .sub { color:#aab5cc; }
.card.bare { background:none; border:0; box-shadow:none; padding:0; }
.card.bare:hover { box-shadow:none; }
.chip { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500; color:var(--accent); background:rgba(47,91,255,.08); border:1px solid rgba(47,91,255,.2); padding:5px 11px; border-radius:999px; margin:0 0 18px; }
.chip::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 0 3px rgba(0,179,155,.2); }
.night .chip { color:#a9bcff; background:rgba(47,91,255,.16); border-color:rgba(120,150,255,.3); }
h1, h2, h3 { font-family:var(--head); letter-spacing:-.035em; margin:0; }
h1 { font-weight:800; font-size:80px; line-height:.98; letter-spacing:-.045em; }
h2 { font-weight:700; font-size:44px; line-height:1.05; margin-bottom:12px; }
h3 { font-weight:600; font-size:19px; letter-spacing:-.015em; line-height:1.25; margin-bottom:6px; }
.sub { font-size:18px; color:var(--mid); margin:0; max-width:38rem; }
p { margin:0; color:var(--mid); }
.grad { background:linear-gradient(90deg,var(--accent),#7b5cff 55%,var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.ph { display:inline-block; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:.82em; font-weight:500; letter-spacing:0; color:var(--accent); border:1px dashed rgba(47,91,255,.5); border-radius:6px; padding:1px 7px; background:rgba(47,91,255,.05); }
.night .ph { color:#b9c7ff; border-color:rgba(185,199,255,.45); background:rgba(255,255,255,.04); }
.row { display:flex; gap:10px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:500; font-size:15px; border-radius:12px; padding:13px 18px; cursor:pointer; border:1px solid transparent; }
.btn.pri { background:var(--ink); color:#fff; } .btn.pri:hover { background:var(--accent); }
.btn.sec { background:#fff; color:var(--ink); border-color:var(--line); } .btn.sec:hover { border-color:var(--accent); color:var(--accent); }
.night .btn.pri { background:#fff; color:var(--ink); } .night .btn.pri:hover { background:var(--accent); color:#fff; }

/* video placeholder tile */
.vid { position:relative; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:linear-gradient(135deg,#0b1220 0%,#1c2f6e 55%,#2f5bff 100%); }
.vid.t2 { background:linear-gradient(135deg,#071d1c 0%,#0a5c56 55%,#00b39b 100%); }
.vid.t3 { background:linear-gradient(135deg,#140f2a 0%,#3b2d7a 55%,#7c6cff 100%); }
.vid.t4 { background:linear-gradient(135deg,#0b1220 0%,#24324f 60%,#5d6f93 100%); }
.vid::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px); background-size:28px 28px; }
.vid img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.vid .pl { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:rgba(255,255,255,.94); box-shadow:0 10px 30px rgba(0,0,0,.3); transition:transform .25s; }
.vid .pl::after { content:''; position:absolute; left:23px; top:18px; border-left:17px solid var(--ink); border-top:11px solid transparent; border-bottom:11px solid transparent; }
.card:hover .vid .pl { transform:scale(1.06); }
.vid .ph { position:absolute; left:12px; bottom:10px; color:#fff; border-color:rgba(255,255,255,.55); background:rgba(0,0,0,.25); }
.vid .dur { position:absolute; right:12px; bottom:10px; font-size:12px; font-weight:500; color:#fff; background:rgba(0,0,0,.45); border-radius:6px; padding:2px 7px; }

/* hero */
.hero { display:grid; grid-template-columns:1.25fr 1fr; gap:44px; align-items:center; }
.hero .kick { font-size:14px; font-weight:500; color:var(--mid); margin:0 0 22px; display:flex; align-items:center; gap:10px; }
.hero .kick b { color:var(--ink); font-weight:600; }
.hero h1 { margin-bottom:24px; }
.hero .sub { margin-bottom:30px; }
.hero .vid { box-shadow:0 30px 80px -30px rgba(11,18,32,.6); }
.hero .note { margin-top:14px; font-size:13px; color:var(--dim); display:flex; justify-content:space-between; }

/* services */
.three { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:28px; }
.tile { border:1px solid var(--line); border-radius:16px; padding:16px 16px 18px; background:#fbfcfe; }
.tile .vid { margin-bottom:16px; }
.night .tile { background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.09); }
.tile .tag { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--accent); margin-bottom:8px; }
.night .tile .tag { color:#a9bcff; }
.also { margin-top:22px; font-size:15px; color:var(--mid); }
.also b { color:var(--ink); }

/* work */
.work { display:grid; grid-template-columns:1.35fr 1fr; gap:30px; margin-top:26px; align-items:start; }
.work .feat .vid { aspect-ratio:1600/880; }
.frames { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.frames figure { margin:0; }
.frames img { width:100%; aspect-ratio:432/228; object-fit:cover; border-radius:9px; display:block; }
.frames figcaption { font-size:12px; color:#8f9bb5; margin-top:6px; }
.work h3 { font-size:24px; margin-bottom:10px; }
.work .logline { font-size:16px; margin-bottom:14px; }
.work .meta { font-size:13px; color:#a9bcff; font-weight:500; margin-bottom:22px; }
.more { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.more .vid { aspect-ratio:16/10; }
.more .vid .pl { width:40px; height:40px; margin:-20px 0 0 -20px; } .more .vid .pl::after { left:16px; top:12px; border-left-width:12px; border-top-width:8px; border-bottom-width:8px; }

/* onsite */
.tiers { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:28px; align-items:end; }
.tier { border-radius:18px; padding:22px; border:1px solid var(--line); background:#fbfcfe; }
.tier:nth-child(2) { background:#f1f4ff; border-color:#dfe6ff; padding-top:34px; }
.tier:nth-child(3) { background:var(--ink); border-color:var(--ink); color:#e8ecf5; padding-top:46px; }
.tier:nth-child(3) p { color:#aab5cc; } .tier:nth-child(3) .tag { color:#a9bcff; }
.tier .tag { font-size:12px; font-weight:600; color:var(--accent); margin-bottom:10px; display:block; }
.scale { display:flex; align-items:center; gap:8px; margin-top:24px; font-size:12.5px; color:var(--dim); }
.scale i { flex:1; height:2px; border-radius:2px; background:linear-gradient(90deg,#c9d4f5,var(--accent)); }

/* event package */
.flowx { display:grid; grid-template-columns:1fr auto 1.3fr; gap:22px; align-items:center; margin-top:30px; }
.cap, .del { border-radius:18px; padding:22px; }
.cap { border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); }
.del { background:linear-gradient(135deg,var(--accent),#5b3dff); color:#fff; box-shadow:0 30px 60px -30px rgba(47,91,255,.8); }
.cap h3, .del h3 { font-size:13px; font-weight:600; letter-spacing:.02em; color:#a9bcff; margin-bottom:14px; font-family:var(--body); }
.del h3 { color:rgba(255,255,255,.8); }
.cap ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; color:#e8ecf5; font-size:15px; }
.cap .fine { margin-top:18px; font-size:13px; color:#8f9bb5; }
.del ol { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.del li { display:grid; grid-template-columns:44px 1fr; align-items:baseline; font-size:15px; }
.del li b { font-family:var(--head); font-size:24px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.arrow { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#a9bcff; text-align:center; }
.arrow svg { width:44px; height:20px; }
.total { display:flex; align-items:baseline; gap:12px; margin-top:4px; }
.total b { font-family:var(--head); font-weight:800; font-size:64px; letter-spacing:-.05em; line-height:1; }

/* process */
.steps { list-style:none; margin:34px 0 0; padding:0; display:grid; grid-template-columns:repeat(5,1fr); gap:16px; position:relative; }
.steps::before { content:''; position:absolute; left:9%; right:9%; top:25px; height:2px; background:repeating-linear-gradient(90deg,#c9d4f5 0 8px,transparent 8px 14px); }
.steps li { position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
.steps i { font-style:normal; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-family:var(--head); font-weight:700; font-size:19px; margin-bottom:14px; box-shadow:0 0 0 6px #fff; }
.steps .y i { background:#e7edff; color:var(--accent); border:1.5px solid #c9d6ff; }
.steps .e i { background:#fff; color:var(--ink); border:1.5px dashed #9aa6bb; }
.steps .m i { background:var(--ink); color:#fff; }
.steps .who { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
.steps .y .who { color:var(--accent); }
.steps b { font-family:var(--head); font-size:17px; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
.steps li > span:last-child { font-size:14px; color:var(--mid); }
.legend { display:flex; gap:18px; margin-top:26px; font-size:13px; color:var(--mid); flex-wrap:wrap; }
.legend span { display:inline-flex; align-items:center; gap:8px; }
.legend i { width:12px; height:12px; border-radius:4px; display:inline-block; }

/* plans */
.ways { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:24px; }
.way { border:1px solid var(--line); border-radius:16px; padding:18px 20px; background:#fbfcfe; }
.way em { font-style:normal; font-family:var(--head); font-weight:700; font-size:22px; color:var(--accent); display:block; margin-bottom:6px; }
.plans { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px; }
.plan { border-radius:18px; padding:22px; border:1px solid var(--line); background:#fff; position:relative; }
.plan .tag { font-size:12px; font-weight:600; color:var(--accent); display:block; margin-bottom:10px; }
.plan h3 { font-size:24px; letter-spacing:-.025em; margin-bottom:10px; }

  const w = ctlEl.offsetWidth, h = ctlEl.offsetHeight, m = 14, bottom = innerHeight - h - m - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0);
  let x = innerWidth / 2, y = bottom;
  const c = cards[current];
  if (c && !flight) {
    const eh = c.el.offsetHeight;
    ndc.set(0, -eh / 2, 0); c.obj.localToWorld(ndc); ndc.project(camera);
    if (ndc.z < 1) { x = (ndc.x + 1) / 2 * innerWidth; y = (1 - ndc.y) / 2 * innerHeight + 18 + pan.cur * 0; }

  ctlPos.x += (x - ctlPos.x) * k; ctlPos.y += (y - ctlPos.y) * k;
  ctlEl.style.transform = `translate(${(ctlPos.x - w / 2).toFixed(1)}px, ${ctlPos.y.toFixed(1)}px)`;
}

// ---------- the black hole: a 20 s end of the fabric, and its recreation ----------
const QA_NOSTRETCH = /nostretch/.test(location.hash), QA_NOFLOW = /noflow/.test(location.hash);
const HOLE = (() => {
  const el = $('hole'), tip = $('holetip'), voidEl = $('void');
  const DUR = 20000, BACK = 6500;
  const st = { t: 0, dir: 0, active: false, ended: false, homes: null, radius: 1.1 * G };
  const base = new THREE.Vector3(0, 0, -13 * G);
  const E = x => Math.min(1, Math.max(0, x)), S3 = (a, b, x) => { const t = E((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const vis = () => (current === 'overview' && !flight) || st.active || st.ended;
  function start() { if (st.active || st.ended) return; st.active = true; st.dir = 1; st.t0 = performance.now() - st.t * DUR; el.classList.add('busy'); document.body.classList.add('ending'); st.homes = {}; for (const k in cards) st.homes[k] = { p: cards[k].obj.position.clone(), r: cards[k].obj.rotation.y }; }
  function recreate() { if (!st.ended) return; st.ended = false; st.active = true; st.dir = -1; st.t0 = performance.now() - (1 - st.t) * BACK; el.classList.add('busy'); el.classList.remove('orb'); tip.textContent = 'Do not click this unless you are okay with the end.'; }
  el.addEventListener('click', () => st.ended ? recreate() : start());
  function apply(t) {
    const sink = 5 * G * S3(0, .3, t) + 2.5 * G * S3(.3, .7, t);
    const flow = QA_NOFLOW ? 0 : 33.5 * G * Math.pow(S3(.3, .97, t), 1.9);                       // how far the fabric has been drawn into the hole
    WARP.uSink.value = sink; WARP.uFlow.value = flow; WARP.uSwirl.value = 5 * S3(.3, .95, t);
    WARP.uR.value = THREE.MathUtils.lerp(2.5 * G, 7 * G, S3(0, .3, t)) + 13 * G * S3(.3, .9, t);
    WARP.uHole.value.set(base.x, -sink * .55, base.z);
    WARP.uStress.value = S3(0, .35, t);
    WARP.uFade.value = S3(.95, 1, t);
    // the white drains into the hole; black takes its place from the edges in
    const black = S3(.45, .82, t), col = new THREE.Color(0xf6f7f9).lerp(new THREE.Color(0x000000), S3(.5, .85, t));
    WARP.uFogCol.value.copy(col);
    const pr = project(WARP.uHole.value), R = (1 - black) * 170;
    voidEl.style.background = black > 0 ? `radial-gradient(circle at ${pr.x.toFixed(1)}px ${pr.y.toFixed(1)}px, #f6f7f9 0, #f6f7f9 ${(R * .55).toFixed(1)}vmax, #000 ${R.toFixed(1)}vmax)` : '';
    document.body.style.setProperty('--glow', 1 - S3(.35, .7, t));
    // the story panels: pulled in and down, nearest first, then gone
    const ids = Object.keys(cards).sort((a, b) => st.homes[a].p.distanceTo(base) - st.homes[b].p.distanceTo(base));
    ids.forEach((k, i) => {
      const c = cards[k], h = st.homes[k], s0 = .2 + i * .09, e = S3(s0, s0 + .3, t);
      // the panel rides its own line: the same warp the fabric gets, plus its own extra slide in once its turn comes
      const wp = warpJS(h.p), pos = wp.p.clone().lerp(WARP.uHole.value.clone().add(new THREE.Vector3(0, 60, 0)), e * e * .9);
      c.obj.position.copy(pos); c.obj.rotation.set(0, h.r, 0); c.obj.scale.setScalar(1);
      // stretched toward the hole, text and all: scale along the hole's direction in the panel's own plane, no rotation
      const lh = c.obj.worldToLocal(WARP.uHole.value.clone()); const a = Math.atan2(-lh.y, lh.x);
      // pulled like a noodle: the edge away from the hole stays put, the panel lengthens toward the hole and thins
      const k1 = 1 + 1.6 * S3(0, .8, e), k2 = 1 - .55 * S3(0, 1, e);
      const ox = 50 - 50 * Math.cos(a), oy = 50 - 50 * Math.sin(a);
      c.el.style.transformOrigin = `${ox.toFixed(1)}% ${oy.toFixed(1)}%`;
      c.el.style.transform = e > 0 && !QA_NOSTRETCH ? `rotate(${a}rad) scale(${k1.toFixed(3)}, ${k2.toFixed(3)}) rotate(${-a}rad)` : '';
      const gone = Math.min(1, Math.hypot(pos.x - WARP.uHole.value.x, pos.z - WARP.uHole.value.z) / (2.2 * G));
      c.el.style.opacity = Math.min(gone, 1 - S3(.8, 1, e), wp.eat).toFixed(3); c.el.style.pointerEvents = e > 0 ? 'none' : '';
      c.ring.material.opacity = .5 * (1 - e);
    });
    stemMat.opacity = .32 * (1 - S3(.2, .6, t));
    // the camera leans in a little
    // the camera is locked on the bird's-eye view
    const v = viewFor('overview'); cam.pos.copy(v.pos); cam.look.copy(v.look);
    st.radius = (1.1 + 1.3 * S3(0, .6, t)) * G;
  }
  function warpJS(p) {
    const H = WARP.uHole.value, dx = p.x - H.x, dz = p.z - H.z, r = Math.hypot(dx, dz) + .001, ux = dx / r, uz = dz / r;
    let nr = Math.max(r - WARP.uFlow.value, 0); const q = nr / WARP.uR.value, well = 1 / Math.sqrt(1 + q * q), w = 1 / (1 + q * q);
    const ang = WARP.uSwirl.value * w, rx = Math.cos(ang) * ux - Math.sin(ang) * uz, rz = Math.sin(ang) * ux + Math.cos(ang) * uz;
    nr = Math.max(nr - WARP.uSink.value * .35 * well, 0);
    const eat = S3(0, 220, nr); let y = p.y - WARP.uSink.value * well; y = THREE.MathUtils.lerp(H.y - 40, y, eat);

  }
  const _v = new THREE.Vector3();
  function project(p) { _v.copy(p).project(camera); return { x: (_v.x + 1) / 2 * innerWidth, y: (1 - _v.y) / 2 * innerHeight, z: _v.z }; }
  function place() {
    const show = vis(); el.hidden = !show; if (!show) return;
    const c = project(WARP.uHole.value), edge = project(WARP.uHole.value.clone().add(new THREE.Vector3(st.radius, 0, 0)));
    const px = Math.max(26, Math.min(220, Math.hypot(edge.x - c.x, edge.y - c.y) * 2));
    el.style.width = el.style.height = px + 'px'; el.style.margin = `-${px / 2}px 0 0 -${px / 2}px`;
    el.style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px)`;
  }
  function tick(now, dt) {
    if (st.active) {
      st.t = st.dir > 0 ? E((now - st.t0) / DUR) : E(1 - (now - st.t0) / BACK);
      apply(st.t);
      if (st.dir > 0 && st.t >= 1) { st.active = false; st.ended = true; el.classList.remove('busy'); el.classList.add('orb'); tip.textContent = 'Click to recreate the fabric of space time'; current = 'overview'; }
      if (st.dir < 0 && st.t <= 0) { st.active = false; el.classList.remove('busy'); document.body.classList.remove('ending'); voidEl.style.background = ''; for (const k in cards) { const c = cards[k], h = st.homes[k]; c.obj.position.copy(h.p); c.obj.rotation.set(0, h.r, 0); c.obj.scale.setScalar(1); c.el.style.opacity = ''; c.el.style.pointerEvents = ''; c.el.style.transform = ''; c.ring.material.opacity = .5; } stemMat.opacity = .32; WARP.uFogCol.value.set(0xf6f7f9); const v = viewFor('overview'); cam.pos.copy(v.pos); cam.look.copy(v.look); navState('overview'); }
    }
    place();
  }
  // QA: freeze the sequence at a given moment (0–1)
  function scrub(t) { if (!st.homes) { st.homes = {}; for (const k in cards) st.homes[k] = { p: cards[k].obj.position.clone(), r: cards[k].obj.rotation.y }; } st.active = false; document.body.classList.add('ending'); st.t = t; apply(t); }
  return { tick, get active() { return st.active; }, get ended() { return st.ended; }, start, recreate, scrub, get t() { return st.t; } };
})();

// ---------- frame loop ----------
const up = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (flight) {
    const k = Math.min(1, (now - flight.t0) / flight.dur), t = ease(k);
    const tt = Math.min(t, .9995), p = flight.path.getPointAt(tt), tan = flight.path.getTangentAt(Math.min(.999, tt + .01));
    // the look direction turns once, on the same curve as the motion, so nothing jolts at corners
    const look = flight.fromLook.clone().lerp(flight.toLook, ease(Math.min(1, k / .9)));
    cam.pos.copy(p); cam.look.copy(look);
    trailGeo.setDrawRange(0, Math.max(2, Math.round(flight.pts.length * t)));
    if (trail.material.opacity > 0) headMat.opacity = smooth(0, .08, k) * (1 - smooth(.8, .95, k)); head.position.copy(flight.path.getPointAt(Math.min(.9995, tt + .06)));
    if (k >= 1) { const v = viewFor(flight.id); cam.pos.copy(v.pos); cam.look.copy(v.look); arrive(flight.id); }
  }
  { const k = 1 - Math.exp(-dt * 8); yaw += (tYaw - yaw) * k; pitch += (tPitch - pitch) * k; }
  const dir = cam.look.clone().sub(cam.pos), dist = dir.length(); dir.normalize();
  const right = new THREE.Vector3().crossVectors(dir, up).normalize();
  dir.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(right, THREE.MathUtils.degToRad(-pitch))).applyQuaternion(new THREE.Quaternion().setFromAxisAngle(up, THREE.MathUtils.degToRad(yaw)));
  pan.cur += (pan.y - pan.cur) * (1 - Math.exp(-dt * 14));
  camera.position.copy(cam.pos).addScaledVector(right, -yaw * 8).addScaledVector(up, pitch * 6 - pan.cur);
  camera.lookAt(tmp.copy(camera.position).addScaledVector(dir, dist));
  // ground rings breathe gently
  const s = 1 + Math.sin(now / 700) * .06; for (const k in cards) cards[k].ring.scale.setScalar(k === current ? s * 1.25 : 1);
  placeCtl(dt); CODE.tick(now); HOLE.tick(now, dt);
  gl.render(scene, camera); css.render(cssScene, camera);
  requestAnimationFrame(frame);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = w < 700 ? 50 : 38; camera.updateProjectionMatrix();
  gl.setSize(w, h, false); css.setSize(w, h); setOverview();
  if (!flight) { const v = viewFor(current === 'flying' ? 'overview' : current); cam.pos.copy(v.pos); cam.look.copy(v.look); }
}
addEventListener('resize', resize); resize();
cam.pos.copy(OVER.pos); cam.look.copy(OVER.look);
requestAnimationFrame(frame);
// Opening move: a beat on the whole grid, then the camera travels in to the intro.
const startAt = hashParts.at || (cards[location.hash.slice(1)] ? location.hash.slice(1) : '');
setTimeout(() => go(cards[startAt] ? startAt : 'hero'), still ? 0 : 900);
window.__wmp = { go, step, get current() { return current; }, cards, camPos: () => camera.position.clone(), HOLE };   // QA
</script>
